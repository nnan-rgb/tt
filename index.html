<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة ترحيبية</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
    </style>
</head>
<body>

    <h1>مرحبا</h1>
    
    <!-- زر مكتوب عليه hi وعند الضغط عليه يتم تشغيل دالة تغيير اللون -->
    <button id="myButton" onclick="changeColor()">hi</button>

    <script>
        function changeColor() {
            var btn = document.getElementById("myButton");
            btn.style.backgroundColor = "red";
            btn.style.color = "white"; // تغيير لون النص إلى الأبيض ليكون واضحاً فوق اللون الأحمر
        }
    </script>

</body>
</html>
